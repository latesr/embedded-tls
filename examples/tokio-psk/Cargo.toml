[package]
name = "ping-tokio-psk"
version = "0.5.0"
edition = "2021"

[dependencies]
# No signature feature: the pre-shared key authenticates the server, so no certificate is checked.
embedded-tls = { path = "../..", default-features = false, features = ["std", "log", "tokio"] }
embassy-crypto-rand = { git = "https://github.com/embassy-rs/embassy", rev = "da5e85fe5d3945d27a0d2066458d0fa3460c8d87" }
embassy-crypto-rustcrypto = { git = "https://github.com/embassy-rs/embassy", rev = "da5e85fe5d3945d27a0d2066458d0fa3460c8d87", features = ["embassy-crypto-sha256", "embassy-crypto-hmac-sha256", "embassy-crypto-aes128-gcm", "embassy-crypto-p256-ecdh", "embassy-crypto-p256-ecdsa"] }
embedded-io-adapters = { version = "0.7", features = ["tokio-1"] }
embedded-io-async = "0.7"
env_logger = "0.10"
tokio = { version = "1", features = ["full"] }
log = "0.4"
pem-parser = "0.1.1"
